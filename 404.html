<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Ecosystem Scouting</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
<style>
/* GitHub Pages serves 404.html from the repo root for any missing path,
   so links here are resolved by the script below against the site root. */
.notfound { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 28px; }
.notfound p { color: var(--muted); max-width: 480px; }
</style>
</head>
<body>
<div class="notfound">
  <span class="brand__mark" style="font-size:40px" aria-hidden="true">&gt;</span>
  <h1 class="display" style="margin-top:18px;font-size:clamp(34px,5vw,56px)">That page is not here</h1>
  <p>The address may be wrong or the page may have moved. Ecosystem Scouting has only a handful of pages, so you are never far from the right one.</p>
  <div class="hero__cta" style="margin-top:28px">
    <a class="pill pill-primary" id="home" href="./">Ecosystem Scouting</a>
    <a class="pill pill-ghost" id="form" href="form/">Submit your company</a>
  </div>
</div>
<script>
  // Point the buttons at the site root even when the missing path was deep (e.g. /repo/a/b/c).
  (function(){
    var root = location.pathname.split('/').slice(0, 2).join('/') + '/';
    if (location.hostname.indexOf('github.io') === -1) root = '/';
    document.getElementById('home').href = root;
    document.getElementById('form').href = root + 'form/';
  })();
</script>
</body>
</html>
